# Ejemplo de server block para nginx en el servidor Dell.
# Copiar a /etc/nginx/sites-available/nocta, enlazar a sites-enabled
# y recargar: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name nocta.tecnosofia.xyz;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Certbot añade aquí el bloque 443 automáticamente:
    # sudo certbot --nginx -d nocta.tecnosofia.xyz
    # (o usar el proxy/SSL de Cloudflare en modo naranja)
}
